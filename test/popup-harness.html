<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Google More — banc d'essai du popup</title>
  <script>
    // Anti-cache : le banc d'essai charge toujours la dernière version des fichiers.
    window.BUST = '?v=' + Date.now();
    document.write('<link rel="stylesheet" href="../popup.css' + BUST + '">');
  </script>
</head>
<body>
  <script>
    // Banc d'essai : affiche le vrai popup hors extension, avec une fausse API chrome et des données
    // de démonstration. Sert aux tests et aux captures du README (test/screenshots.py).
    //   http://127.0.0.1:8766/test/popup-harness.html?tab=page|rewrite|titles|password  (titles = onglet « 🎬 YouTube »)
    //   &stale=1 : simule un service worker pas rechargé (il ne répond à aucun message).
    //   &maj=1.9.0 : GitHub annonce cette version (bandeau « Version 1.9.0 disponible ») ;
    //   &maj=404 : GitHub injoignable ou dépôt privé ; sans maj : l'extension est à jour.
    //   ?tab=settings : page Paramètres.
    const params = new URLSearchParams(location.search);
    const TAB = params.get('tab') || 'titles';
    const STALE = params.has('stale');
    const MAJ = params.get('maj');
    //   &dossier=0 : dossier de l'extension pas encore choisi (bandeau « Choisis le dossier… »).
    const FOLDER = params.get('dossier') === '0' ? null : 'google-more';

    // ---------------------------------------------------------------- données de démonstration

    const TITLES = [
      "J'ai tout acheté sur les Jeux les plus Pay2Win de Roblox...",
      "J'ai Joué au Jeux les plus PAY TO WIN de Roblox..",
      'J’ai Joué aux Jeux les Plus CHER de Roblox…'
    ];
    const TITLES_ANSWER = JSON.stringify({ titres: [
      { n: 1, ok: true, corrige: TITLES[0], explication: '' },
      { n: 2, ok: false, corrige: "J'ai joué aux jeux les plus PAY TO WIN de Roblox...", explication: '« au » devient « aux » devant un nom pluriel.' },
      { n: 3, ok: false, corrige: 'J’ai joué aux jeux les plus chers de Roblox…', explication: '« cher » s’accorde avec « jeux ».' }
    ] });

    const REWRITE_INPUT = "salut, jai regarder ton mail et je pense quon peut se voir mardi si sa te va, dit moi";
    const REWRITE_RESULT = "Salut, j'ai regardé ton mail et je pense qu'on peut se voir mardi si ça te va, dis-moi.";

    const DEMO = {
      page: {
        tab: { id: 1, url: 'https://fr.wikipedia.org/wiki/Tarte_aux_pommes', title: 'Tarte aux pommes — Wikipédia' },
        job: null
      },
      rewrite: {
        tab: { id: 1, url: 'https://mail.google.com/mail/u/0/', title: 'Boîte de réception - Gmail' },
        job: { id: 2, kind: 'rewrite', mode: 'fix', status: 'done', finishedAt: Date.now(), input: REWRITE_INPUT,
          result: REWRITE_RESULT, copied: true }
      },
      titles: {
        tab: { id: 1, url: 'https://studio.youtube.com/video/x/edit', title: 'Détails de la vidéo - YouTube Studio' },
        job: { id: 1, kind: 'titles', status: 'done', finishedAt: Date.now(), result: TITLES_ANSWER, report: null,
          applied: { replaced: 2, missing: [], where: 'le test A/B de YouTube Studio', total: 2 } }
      }
    }[TAB] || {};

    // ---------------------------------------------------------------- fausse API chrome

    const runtime = {
      id: 'banc-d-essai',
      lastError: null,
      getManifest: () => ({ version: globalThis.GM_BUILD }),
      getURL: (p) => '../' + p,
      reload: () => { document.title = 'rechargement demandé'; },
      sendMessage: (m, cb) => {
        if (!cb) return;
        if (STALE) {
          runtime.lastError = { message: 'The message port closed before a response was received.' };
          cb(undefined);
          runtime.lastError = null;
          return;
        }
        cb(m.type === 'gm-build' ? { build: globalThis.GM_BUILD } : { ok: true });
      }
    };

    window.chrome = {
      runtime,
      storage: {
        sync: { get: (d, cb) => cb({ ...d }), set: () => {} },
        session: { get: (k, cb) => cb({ gmJob: DEMO.job || null }), set: () => {} },
        // Réponse par rappel ou par promesse, comme la vraie API.
        local: {
          get: (d, cb) => { const v = typeof d === 'string' ? {} : { ...d }; if (cb) cb(v); return Promise.resolve(v); },
          set: () => Promise.resolve()
        },
        onChanged: { addListener() {} }
      },
      tabs: {
        query: async () => [DEMO.tab || { id: 1, url: 'https://example.com/', title: 'Exemple' }],
        create: ({ url }) => { document.title = 'onglet ouvert : ' + url; }
      },
      management: { getSelf: async () => ({ installType: 'development' }) },
      action: { setBadgeText: async () => {}, setBadgeBackgroundColor: async () => {}, getBadgeText: async () => '' },
      scripting: {
        executeScript: async ({ func }) => {
          const name = func && func.name;
          if (name === 'pageSelection') return [{ result: TAB === 'rewrite' ? REWRITE_INPUT : '' }];
          if (name === 'pageTitles') return [{ result: { titles: TITLES, where: 'le test A/B de YouTube Studio', inDialog: true } }];
          return [{ result: null }];
        }
      }
    };

    // version.json sur GitHub (lu par tools/update/update-core.js), selon le paramètre maj.
    const realFetch = window.fetch.bind(window);
    window.fetch = (url, opts) => {
      if (String(url).startsWith('https://raw.githubusercontent.com/')) {
        if (MAJ === '404') return Promise.resolve(new Response('Not Found', { status: 404 }));
        const version = MAJ || globalThis.GM_BUILD;
        return Promise.resolve(new Response(JSON.stringify({ version, ref: 'abc1234', files: ['manifest.json'],
          notes: 'Nouveautés de démonstration.' }), { status: 200 }));
      }
      return realFetch(url, opts);
    };

    // ---------------------------------------------------------------- chargement du vrai popup

    const load = (src) => new Promise((ok, ko) => {
      const s = document.createElement('script');
      s.src = src + BUST; s.onload = ok; s.onerror = ko;
      document.body.appendChild(s);
    });

    (async () => {
      try { localStorage.setItem('gmPopupTab', TAB); } catch (_) { /* stockage indisponible */ }
      const html = await fetch('../popup.html' + BUST).then((r) => r.text());
      const body = /<body>([\s\S]*)<\/body>/.exec(html)[1].replace(/<script[\s\S]*?<\/script>/g, '');
      document.body.insertAdjacentHTML('afterbegin', body.replace(/src="icons\//g, 'src="../icons/'));
      await load('../tools/version.js');
      await load('../tools/update/update-core.js');
      __gmUpdate.dossierMemorise = async () => FOLDER; // pas de vrai dossier mémorisé dans le banc d'essai
      await load('../tools/gemini-rewrite/prompts.js');
      await load('../tools/youtube-titles/titles.js');
      await load('../tools/password/password.js');
      if (DEMO.job && DEMO.job.kind === 'titles') DEMO.job.report = GM_TITLES.parseReport(TITLES_ANSWER, TITLES);
      await load('../popup.js');
      await load('../tools/gemini-rewrite/popup-rewrite.js');
      await load('../tools/youtube-titles/popup-titles.js');
      await load('../tools/youtube-ab/popup-ab.js');
      await load('../tools/password/popup-password.js');
      await load('../tools/update/popup-update.js');
      showTab(TAB);
      if (TAB === 'page') {
        setStatus('Copié dans le presse-papier\n11 Ko · ~2 781 tokens\nFichier : Tarte aux pommes — Wikipédia.txt', 'ok');
      }
      await new Promise((r) => setTimeout(r, 300)); // laisse le pré-remplissage se terminer
      document.title = 'banc prêt';
    })();
  </script>
</body>
</html>
